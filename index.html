        let selectedStationIndex = null;

        function initMap() {
            // Default center: Taoyuan City
            map = L.map('map', {
                center: [24.9750, 121.2650],
                zoom: 12,
                zoomControl: true
            });

            // Add OpenStreetMap Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
            districtClusterGroup = L.layerGroup().addTo(map);
        }

        function processRawData(csvRows) {
            // Group by district to compute deterministic coordinates scattering
            const districtCounters = {};

            processedData = csvRows.map((row, idx) => {
                const district = (row['場站區域'] || '其他').trim();
                const total = parseInt(row['總車位數'] || 0, 10);
                const available = parseInt(row['可借車位數'] || 0, 10);
                const borrowed = parseInt(row['已借車位數'] || 0, 10);
                const returnable = parseInt(row['可還空位數'] || 0, 10);
                const unusedRate = parseInt(row['未使用率'] || 0, 10);
                const usedRate = parseInt(row['已使用率'] || 0, 10);

                // Increment district station counter
                if (!districtCounters[district]) districtCounters[district] = 0;
                const counter = districtCounters[district]++;

                // Calculate scatter coordinate offset (Option B implementation)
                const baseCoord = DISTRICT_COORDS[district] || { lat: 24.9750, lng: 121.2650 };
                
                // Spiral / Grid offset math for distinct visual markers
                const cols = 8;
                const rowIdx = Math.floor(counter / cols);
                const colIdx = counter % cols;
                
                // Offset latitude and longitude slightly
                const latOffset = (rowIdx - 3) * 0.0035 + (Math.sin(counter) * 0.0008);
                const lngOffset = (colIdx - 4) * 0.0045 + (Math.cos(counter) * 0.0008);

                const lat = baseCoord.lat + latOffset;
                const lng = baseCoord.lng + lngOffset;

                // Color badge determination based on available bikes
                let statusColor = 'green'; // 🟢 充足
                let statusBgClass = 'bg-emerald-500';
                let statusText = '充足';

                if (available === 0) {
                    statusColor = 'red'; // 🔴 無車
                    statusBgClass = 'bg-rose-500';
                    statusText = '無車';
                } else if (available < 5) {
                    statusColor = 'yellow'; // 🟡 吃緊
                    statusBgClass = 'bg-amber-500';
                    statusText = '吃緊';
                }

                return {
                    id: idx + 1,
                    district: district,
                    name: `${district} 站點 #${districtCounters[district]}`,
                    total: total,
                    available: available,
                    borrowed: borrowed,
                    returnable: returnable,
                    unusedRate: unusedRate,
                    usedRate: usedRate,
                    lat: lat,
                    lng: lng,
                    statusColor: statusColor,
                    statusBgClass: statusBgClass,
                    statusText: statusText
                };
            });

            applyFiltersAndRender();
        }

        function updateKPIs(data) {
            const totalStations = data.length;
            const totalAvailable = data.reduce((sum, item) => sum + item.available, 0);
            const totalReturnable = data.reduce((sum, item) => sum + item.returnable, 0);
            const avgUtil = totalStations > 0 
                ? Math.round(data.reduce((sum, item) => sum + item.usedRate, 0) / totalStations) 
                : 0;

            document.getElementById('kpiTotalStations').textContent = totalStations.toLocaleString();
            document.getElementById('kpiTotalAvailable').textContent = totalAvailable.toLocaleString();
            document.getElementById('kpiTotalReturnable').textContent = totalReturnable.toLocaleString();
            document.getElementById('kpiAvgUtilization').textContent = `${avgUtil}%`;
            document.getElementById('matchingCount').textContent = totalStations;
            document.getElementById('currentStatusText').textContent = `已載入 ${totalStations} 筆資料`;
        }

        function applyFiltersAndRender() {
            const districtVal = document.getElementById('districtFilter').value;
            const sortVal = document.getElementById('sortFilter').value;

            // 1. District Filter
            let filtered = [...processedData];
            if (districtVal !== 'ALL') {
                filtered = filtered.filter(item => item.district === districtVal);
            }

            // 2. Sort Logic
            filtered.sort((a, b) => {
                if (sortVal === 'avail_desc') return b.available - a.available;
                if (sortVal === 'avail_asc') return a.available - b.available;
                if (sortVal === 'util_desc') return b.usedRate - a.usedRate;
                if (sortVal === 'util_asc') return a.usedRate - b.usedRate;
                if (sortVal === 'total_desc') return b.total - a.total;
                return 0;
            });

            activeFilteredData = filtered;

            // Update UI elements
            updateKPIs(activeFilteredData);
            renderMapMarkers(activeFilteredData);
            renderStationList(activeFilteredData);
        }

        function renderMapMarkers(data) {
            markersGroup.clearLayers();
            districtClusterGroup.clearLayers();

            const currentZoom = map.getZoom();

            // Render individual station markers
            data.forEach((station) => {
                let badgeColorHex = '#10b981'; // Green
                if (station.statusColor === 'yellow') badgeColorHex = '#f59e0b'; // Yellow
                if (station.statusColor === 'red') badgeColorHex = '#f43f5e'; // Red

                const customIcon = L.divIcon({
                    className: 'custom-marker-wrapper',
                    html: `<div class="custom-marker" style="background-color: ${badgeColorHex}; width: 28px; height: 28px;">
                            ${station.available}
                          </div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([station.lat, station.lng], { icon: customIcon });

                // Popup content
                const popupHTML = `
                    <div class="p-1 min-w-[200px]">
                        <div class="flex items-center justify-between border-b pb-2 mb-2">
                            <span class="text-xs font-bold text-slate-500 uppercase">${station.district}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full text-white font-semibold ${station.statusBgClass}">
                                ${station.statusText} (${station.available}可借)
                            </span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-sm mb-2">${station.name}</h4>
                        <div class="grid grid-cols-2 gap-1.5 text-xs text-slate-600 mb-2">
                            <div class="bg-slate-50 p-1.5 rounded">總車位：<strong class="text-slate-800">${station.total}</strong></div>
                            <div class="bg-emerald-50 p-1.5 rounded text-emerald-800">可借數：<strong>${station.available}</strong></div>
                            <div class="bg-sky-50 p-1.5 rounded text-sky-800">可還數：<strong>${station.returnable}</strong></div>
                            <div class="bg-amber-50 p-1.5 rounded text-amber-800">使用率：<strong>${station.usedRate}%</strong></div>
                        </div>
                        <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-amber-500 h-full" style="width: ${station.usedRate}%"></div>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHTML);
                marker.on('click', () => {
                    highlightStationCard(station.id);
                });

                markersGroup.addLayer(marker);
            });

            // Adjust view bounds if we have points
            if (data.length > 0) {
                const bounds = L.latLngBounds(data.map(d => [d.lat, d.lng]));
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
            }
        }

        function renderStationList(data) {
            const container = document.getElementById('stationListContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p class="text-sm">沒有找到符合條件的站點資料</p>
                    </div>
                `;
                return;
            }

            data.forEach((station) => {
                const card = document.createElement('div');
                card.id = `station-card-${station.id}`;
                card.className = `p-3 rounded-xl border border-slate-200 bg-white hover:border-amber-400 hover:shadow-md transition cursor-pointer flex flex-col gap-2`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="inline-block text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md mb-1">${station.district}</span>
                            <h3 class="font-bold text-slate-800 text-sm">${station.name}</h3>
                        </div>
                        <span class="text-xs px-2 py-1 rounded-md text-white font-bold ${station.statusBgClass}">
                            可借 ${station.available}
                        </span>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-center text-xs py-1 bg-slate-50 rounded-lg">
                        <div>
                            <p class="text-[10px] text-slate-400">總車位</p>
                            <p class="font-bold text-slate-700">${station.total}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400">可還數</p>
                            <p class="font-bold text-sky-600">${station.returnable}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400">使用率</p>
                            <p class="font-bold text-amber-600">${station.usedRate}%</p>
                        </div>
                    </div>

                    <!-- Utilization bar -->
                    <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-amber-400 to-orange-500 h-full" style="width: ${station.usedRate}%"></div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    focusStationOnMap(station);
                });

                container.appendChild(card);
            });
        }

        function focusStationOnMap(station) {
            map.setView([station.lat, station.lng], 16, { animate: true });
            
            // Open popup for the station
            markersGroup.eachLayer((layer) => {
                if (layer.getLatLng().lat === station.lat && layer.getLatLng().lng === station.lng) {
                    layer.openPopup();
                }
            });

            highlightStationCard(station.id);
        }

        function highlightStationCard(stationId) {
            // Clear previous highlight
            document.querySelectorAll('#stationListContainer > div').forEach(el => {
                el.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-50/30');
            });

            const card = document.getElementById(`station-card-${stationId}`);
            if (card) {
                card.classList.add('ring-2', 'ring-amber-500', 'bg-amber-50/30');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function loadCSVContent(csvText) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function (results) {
                    if (results.data && results.data.length > 0) {
                        rawData = results.data;
                        processRawData(rawData);
                    } else {
                        alert('CSV 檔案為空或無法順利解析');
                    }
                },
                error: function (err) {
                    console.error('CSV Parsing Error:', err);
                    alert('解析 CSV 檔案時發生錯誤');
                }
            });
        }

        // Attach Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            initMap();

            // Automatically attempt to fetch external CSV or fallback to default
            fetch('Youbike即時服務資料.csv')
                .then(response => {
                    if (!response.ok) throw new Error('Network file not found');
                    return response.text();
                })
                .then(text => loadCSVContent(text))
                .catch(err => {
                    console.warn('Direct fetch failed, fallback to embedded dataset:', err);
                    loadCSVContent(DEFAULT_CSV_TEXT);
                });

            // File Upload Listener
            document.getElementById('csvFileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (evt) {
                        loadCSVContent(evt.target.result);
                    };
                    reader.readAsText(file, 'UTF-8');
                }
            });

            // District Filter Listener
            document.getElementById('districtFilter').addEventListener('change', () => {
                applyFiltersAndRender();
            });

            // Sort Filter Listener
            document.getElementById('sortFilter').addEventListener('change', () => {
                applyFiltersAndRender();
            });

            // Clear Filters Button
            document.getElementById('clearFiltersBtn').addEventListener('click', () => {
                document.getElementById('districtFilter').value = 'ALL';
                document.getElementById('sortFilter').value = 'avail_desc';
                applyFiltersAndRender();
            });

            // Reset Map View Button
            document.getElementById('resetViewBtn').addEventListener('click', () => {
                document.getElementById('districtFilter').value = 'ALL';
                applyFiltersAndRender();
            });
        });
    </script>
</body>
</html>
